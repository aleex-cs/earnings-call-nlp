services:
  - type: web
    name: earnings-call-nlp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HF_HOME
        value: /opt/render/project/src/.hf_cache
      - key: TRANSFORMERS_CACHE
        value: /opt/render/project/src/.hf_cache
      - key: NLTK_DATA
        value: /opt/render/project/src/nltk_data
